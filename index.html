<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IQD→USDT">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-512.png">
<title>IQD → USDT</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background:#000; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 18px);
    user-select:none; -webkit-user-select:none;
  }
  .label { font-size:13px; color:#909090; letter-spacing:.5px; text-transform:uppercase; }
  .result-wrap { text-align:center; margin-top:26px; }
  .result { font-size:72px; font-weight:800; line-height:1; letter-spacing:-2px; font-variant-numeric:tabular-nums; }
  .result .unit { font-size:24px; font-weight:600; color:#c5f000; letter-spacing:0; margin-left:6px; }
  .result-sub { margin-top:10px; font-size:14px; color:#909090; font-variant-numeric:tabular-nums; }
  .copy-hint { margin-top:6px; font-size:11px; color:#5a5a5a; }
  .fields { margin-top:34px; display:flex; flex-direction:column; gap:12px; }
  .field { background:#181818; border-radius:16px; padding:14px 18px; }
  .field .flabel { font-size:12px; color:#909090; margin-bottom:6px; display:flex; justify-content:space-between; }
  .field .flabel .reset { color:#c5f000; font-weight:600; cursor:pointer; }
  .field input {
    width:100%; background:transparent; border:none; outline:none; color:#fff;
    font-size:30px; font-weight:700; font-family:inherit;
    font-variant-numeric:tabular-nums; user-select:text; -webkit-user-select:text;
  }
  .field input::placeholder { color:#3d3d3d; font-weight:400; }
  .field .cur { font-size:14px; color:#909090; font-weight:600; }
  .chips { display:flex; gap:8px; margin-top:12px; }
  .chip {
    flex:1; background:#181818; border:none; border-radius:12px; color:#fff;
    padding:12px 0; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;
  }
  .chip:active { background:#2a2a2a; }
  .ref { margin-top:auto; padding-top:22px; }
  .ref .rrow {
    display:flex; justify-content:space-between; padding:9px 4px;
    border-bottom:1px solid #161616; font-size:14px; color:#909090;
    font-variant-numeric:tabular-nums;
  }
  .ref .rrow b { color:#fff; font-weight:600; }
  .ref .rtitle { font-size:11px; color:#5a5a5a; text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
  .toast {
    position:fixed; left:50%; bottom:15%; transform:translateX(-50%);
    background:#c5f000; color:#000; padding:10px 22px; border-radius:22px;
    font-size:14px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .25s;
    z-index:99;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>
  <div class="label">Calculator</div>
  <div class="result-wrap" id="resulttap">
    <div class="result"><span id="out">0.00</span><span class="unit">USDT</span></div>
    <div class="result-sub" id="outsub">enter price &amp; amount</div>
    <div class="copy-hint">tap result to copy</div>
  </div>
  <div class="fields">
    <div class="field">
      <div class="flabel"><span>Unit price</span><span class="reset" id="resetrate">reset</span></div>
      <input id="rate" type="text" inputmode="decimal" placeholder="1542.99" autocomplete="off">
      <div class="cur">IQD per 1 USDT</div>
    </div>
    <div class="field">
      <div class="flabel"><span>Amount</span></div>
      <input id="amt" type="text" inputmode="decimal" placeholder="1,000,000" autocomplete="off">
      <div class="cur">IQD</div>
    </div>
  </div>
  <div class="chips">
    <button class="chip" data-v="100000">100K</button>
    <button class="chip" data-v="500000">500K</button>
    <button class="chip" data-v="1000000">1M</button>
    <button class="chip" data-v="5000000">5M</button>
  </div>
  <div class="ref">
    <div class="rtitle">At current rate</div>
    <div class="rrow"><span>100,000 IQD</span><b id="r1">—</b></div>
    <div class="rrow"><span>500,000 IQD</span><b id="r2">—</b></div>
    <div class="rrow"><span>1,000,000 IQD</span><b id="r3">—</b></div>
    <div class="rrow"><span>5,000,000 IQD</span><b id="r4">—</b></div>
  </div>
<div class="toast" id="toast">Copied</div>
<script>
const DEFAULT_RATE = 1542.99;
const rateEl = document.getElementById("rate");
const amtEl = document.getElementById("amt");
rateEl.value = localStorage.getItem("rate") || "";
amtEl.value = localStorage.getItem("amt") || "";
const num = (s) => {
  const v = parseFloat(String(s).replace(/,/g, ""));
  return isFinite(v) && v > 0 ? v : 0;
};
const fmt = (n, d) => n.toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
function render() {
  const r = num(rateEl.value);
  const a = num(amtEl.value);
  const out = document.getElementById("out");
  const sub = document.getElementById("outsub");
  if (r > 0) localStorage.setItem("rate", rateEl.value.trim());
  localStorage.setItem("amt", amtEl.value.trim());
  if (r > 0 && a > 0) {
    out.textContent = fmt(a / r, 2);
    sub.textContent = fmt(a, 0) + " IQD ÷ " + fmt(r, 2) + " IQD/USDT";
  } else {
    out.textContent = "0.00";
    sub.textContent = r > 0 ? "enter amount" : "enter price & amount";
  }
  const rows = [["r1", 1e5], ["r2", 5e5], ["r3", 1e6], ["r4", 5e6]];
  for (const [id, v] of rows) {
    document.getElementById(id).textContent = r > 0 ? fmt(v / r, 2) + " USDT" : "—";
  }
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1200);
}
rateEl.addEventListener("input", render);
amtEl.addEventListener("input", render);
document.getElementById("resetrate").addEventListener("click", () => {
  rateEl.value = DEFAULT_RATE;
  render();
});
document.querySelectorAll(".chip").forEach(c =>
  c.addEventListener("click", () => { amtEl.value = c.dataset.v; render(); })
);
document.getElementById("resulttap").addEventListener("click", () => {
  const v = document.getElementById("out").textContent;
  if (v === "0.00") return;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(v).then(() => toast("Copied " + v + " USDT")).catch(() => toast(v + " USDT"));
  } else { toast(v + " USDT"); }
});
render();
</script>
</body>
</html>
