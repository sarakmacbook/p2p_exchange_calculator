<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IQD→USDT">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<title>IQD → USDT Calculator</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background:#000; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 18px);
    user-select:none; -webkit-user-select:none;
  }

  .label { font-size:13px; color:#909090; letter-spacing:.5px; text-transform:uppercase; }

  .tabs { display:flex; gap:8px; margin-top:12px; }
  .tab {
    flex:1; background:#181818; border:none; border-radius:12px; color:#909090;
    padding:12px 0; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;
    transition: all 0.2s;
  }
  .tab.active { background:#c5f000; color:#000; }
  .tab:active { opacity:0.8; }

  .result-wrap { text-align:center; margin-top:30px; }
  .result-label { font-size:14px; color:#c5f000; font-weight:600; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
  .result { font-size:48px; font-weight:700; line-height:1; letter-spacing:-1px; font-variant-numeric:tabular-nums; }
  .result .unit { font-size:18px; font-weight:600; color:#909090; letter-spacing:0; margin-left:4px; }
  .result-sub { margin-top:8px; font-size:13px; color:#5a5a5a; font-variant-numeric:tabular-nums; }
  .copy-hint { margin-top:6px; font-size:11px; color:#3d3d3d; }

  .fields { margin-top:30px; display:flex; flex-direction:column; gap:12px; }
  .field { background:#181818; border-radius:16px; padding:14px 18px; }
  .field .flabel { font-size:12px; color:#909090; margin-bottom:6px; display:flex; justify-content:space-between; }
  .field .flabel .reset { color:#c5f000; font-weight:600; cursor:pointer; }
  .field input {
    width:100%; background:transparent; border:none; outline:none; color:#fff;
    font-size:28px; font-weight:700; font-family:inherit;
    font-variant-numeric:tabular-nums; user-select:text; -webkit-user-select:text;
  }
  .field input::placeholder { color:#3d3d3d; font-weight:400; }
  .field .cur { font-size:13px; color:#5a5a5a; font-weight:600; margin-top:2px; }

  .chips { display:flex; gap:8px; margin-top:12px; }
  .chip {
    flex:1; background:#181818; border:none; border-radius:12px; color:#fff;
    padding:12px 0; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;
  }
  .chip:active { background:#2a2a2a; }

  .scale { margin-top:auto; padding-top:22px; }
  .scale .srow {
    display:flex; justify-content:space-between; padding:10px 4px;
    border-bottom:1px solid #161616; font-size:15px; color:#909090;
    font-variant-numeric:tabular-nums;
  }
  .scale .srow b { color:#c5f000; font-weight:700; }
  .scale .stitle { font-size:11px; color:#5a5a5a; text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }

  .toast {
    position:fixed; left:50%; bottom:15%; transform:translateX(-50%);
    background:#c5f000; color:#000; padding:10px 22px; border-radius:22px;
    font-size:14px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .25s;
    z-index:99;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>

  <div class="label">Calculator</div>

  <div class="tabs">
    <button class="tab active" data-currency="iqd">IQD</button>
    <button class="tab" data-currency="usd">USD</button>
  </div>

  <div class="result-wrap" id="resulttap">
    <div class="result-label">Receive</div>
    <div class="result"><span id="out">0.00</span><span class="unit">USDT</span></div>
    <div class="result-sub" id="outsub">enter price &amp; amount</div>
    <div class="copy-hint">tap to copy</div>
  </div>

  <div class="fields">
    <div class="field">
      <div class="flabel"><span>Unit price</span><span class="reset" id="resetrate">reset</span></div>
      <input id="rate" type="text" inputmode="decimal" placeholder="14" autocomplete="off">
      <div class="cur" id="ratecur">IQD per 1 USDT</div>
    </div>
    <div class="field">
      <div class="flabel"><span>Amount send</span><span class="reset" id="resetamt">clear</span></div>
      <input id="amt" type="text" inputmode="decimal" placeholder="500,000" autocomplete="off">
      <div class="cur" id="amtcur">IQD</div>
    </div>
  </div>

  <div class="chips" id="chips">
    <button class="chip" data-v="500000">500K</button>
    <button class="chip" data-v="1000000">1M</button>
    <button class="chip" data-v="1500000">1.5M</button>
    <button class="chip" data-v="2000000">2M</button>
  </div>

  <div class="scale">
    <div class="stitle">Scale at current rate</div>
    <div class="srow"><span id="s1label">500,000 IQD</span><b id="s1">—</b></div>
    <div class="srow"><span id="s2label">1,000,000 IQD</span><b id="s2">—</b></div>
    <div class="srow"><span id="s3label">1,500,000 IQD</span><b id="s3">—</b></div>
    <div class="srow"><span id="s4label">2,000,000 IQD</span><b id="s4">—</b></div>
  </div>

<div class="toast" id="toast">Copied</div>

<script>
const DEFAULT_RATES = { iqd: 14, usd: 1 };
const CURRENCY_CONFIG = {
  iqd: {
    rateLabel: "IQD per 1 USDT",
    amtLabel: "IQD",
    placeholder: "500,000",
    chips: [500000, 1000000, 1500000, 2000000],
    chipLabels: ["500K", "1M", "1.5M", "2M"],
    scaleAmounts: [500000, 1000000, 1500000, 2000000],
    scaleLabels: ["500,000 IQD", "1,000,000 IQD", "1,500,000 IQD", "2,000,000 IQD"]
  },
  usd: {
    rateLabel: "USD per 1 USDT",
    amtLabel: "USD",
    placeholder: "500",
    chips: [500, 1000, 1500, 2000],
    chipLabels: ["500", "1K", "1.5K", "2K"],
    scaleAmounts: [500, 1000, 1500, 2000],
    scaleLabels: ["500 USD", "1,000 USD", "1,500 USD", "2,000 USD"]
  }
};

let currentCurrency = "iqd";
const rateEl = document.getElementById("rate");
const amtEl = document.getElementById("amt");

const savedCurrency = localStorage.getItem("currency");
if (savedCurrency) currentCurrency = savedCurrency;

const savedRate = localStorage.getItem("rate_" + currentCurrency);
rateEl.value = savedRate || DEFAULT_RATES[currentCurrency];
amtEl.value = localStorage.getItem("amt_" + currentCurrency) || "";

const num = (s) => {
  const v = parseFloat(String(s).replace(/,/g, ""));
  return isFinite(v) && v > 0 ? v : 0;
};
const fmt = (n, d) => n.toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});

function updateUI() {
  const cfg = CURRENCY_CONFIG[currentCurrency];
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.dataset.currency === currentCurrency);
  });
  document.getElementById("ratecur").textContent = cfg.rateLabel;
  document.getElementById("amtcur").textContent = cfg.amtLabel;
  amtEl.placeholder = cfg.placeholder;
  const chipsContainer = document.getElementById("chips");
  chipsContainer.innerHTML = "";
  cfg.chips.forEach((val, i) => {
    const btn = document.createElement("button");
    btn.className = "chip";
    btn.dataset.v = val;
    btn.textContent = cfg.chipLabels[i];
    btn.addEventListener("click", () => { amtEl.value = val; render(); });
    chipsContainer.appendChild(btn);
  });
  cfg.scaleLabels.forEach((label, i) => {
    document.getElementById("s" + (i+1) + "label").textContent = label;
  });
}

function render() {
  const r = num(rateEl.value);
  const a = num(amtEl.value);
  const out = document.getElementById("out");
  const sub = document.getElementById("outsub");
  const cfg = CURRENCY_CONFIG[currentCurrency];

  if (r > 0) localStorage.setItem("rate_" + currentCurrency, rateEl.value.trim());
  localStorage.setItem("amt_" + currentCurrency, amtEl.value.trim());
  localStorage.setItem("currency", currentCurrency);

  if (r > 0 && a > 0) {
    out.textContent = fmt(a / r, 2);
    sub.textContent = fmt(a, 0) + " " + cfg.amtLabel + " ÷ " + fmt(r, 2) + " " + cfg.amtLabel + "/USDT";
  } else {
    out.textContent = "0.00";
    sub.textContent = r > 0 ? "enter amount" : "enter price & amount";
  }

  cfg.scaleAmounts.forEach((val, i) => {
    document.getElementById("s" + (i+1)).textContent = r > 0 ? fmt(val / r, 2) + " USDT" : "—";
  });
}

function switchCurrency(curr) {
  currentCurrency = curr;
  const savedRate = localStorage.getItem("rate_" + curr);
  rateEl.value = savedRate || DEFAULT_RATES[curr];
  amtEl.value = localStorage.getItem("amt_" + curr) || "";
  updateUI();
  render();
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1200);
}

rateEl.addEventListener("input", render);
amtEl.addEventListener("input", render);

document.getElementById("resetrate").addEventListener("click", () => {
  rateEl.value = DEFAULT_RATES[currentCurrency];
  render();
});

document.getElementById("resetamt").addEventListener("click", () => {
  amtEl.value = "";
  render();
});

document.querySelectorAll(".tab").forEach(t =>
  t.addEventListener("click", () => switchCurrency(t.dataset.currency))
);

document.getElementById("resulttap").addEventListener("click", () => {
  const v = document.getElementById("out").textContent;
  if (v === "0.00") return;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(v).then(() => toast("Copied " + v + " USDT")).catch(() => toast(v + " USDT"));
  } else { toast(v + " USDT"); }
});

updateUI();
render();
</script>
</body>
</html>
